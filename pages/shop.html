<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="shop.css" />
    <title>Shop — Clerks</title>
  </head>

  <body>
    <script src="../js/navbar.js"></script>

    <main class="container shop">
      <header class="page-header shop-header">
        <span class="eyebrow">The Collection</span>
        <h1 id="shop-title">Shop All</h1>
        <p>Every style, every size, crafted for comfort.</p>
      </header>

      <div class="shop-layout">
        <aside class="filters" aria-label="Filters">
          <div class="filters__head">
            <span class="filters__heading">Filters</span>
            <button type="button" class="filters__clear" id="clear-filters">
              Clear all
            </button>
          </div>
          <details class="filter" data-filter="category" open>
            <summary class="filter__title">Category</summary>
            <div class="filter__options">
              <label class="check"><input type="checkbox" value="men" /><span>Men</span></label>
              <label class="check"><input type="checkbox" value="women" /><span>Women</span></label>
              <label class="check"><input type="checkbox" value="kids" /><span>Kids</span></label>
            </div>
          </details>
          <details class="filter" data-filter="style" open>
            <summary class="filter__title">Style</summary>
            <div class="filter__options">
              <label class="check"><input type="checkbox" value="casual" /><span>Casual</span></label>
              <label class="check"><input type="checkbox" value="sport" /><span>Sport</span></label>
              <label class="check"><input type="checkbox" value="luxury" /><span>Luxury</span></label>
            </div>
          </details>
          <details class="filter" data-filter="colour">
            <summary class="filter__title">Colour</summary>
            <div class="filter__options">
              <label class="check"><input type="checkbox" value="black" /><span>Black</span></label>
              <label class="check"><input type="checkbox" value="blue" /><span>Blue</span></label>
              <label class="check"><input type="checkbox" value="brown" /><span>Brown</span></label>
              <label class="check"><input type="checkbox" value="grey" /><span>Grey</span></label>
              <label class="check"><input type="checkbox" value="pink" /><span>Pink</span></label>
              <label class="check"><input type="checkbox" value="white" /><span>White</span></label>
            </div>
          </details>
          <details class="filter" data-filter="material">
            <summary class="filter__title">Material</summary>
            <div class="filter__options">
              <label class="check"><input type="checkbox" value="fabric" /><span>Fabric</span></label>
              <label class="check"><input type="checkbox" value="leather" /><span>Leather</span></label>
            </div>
          </details>
          <details class="filter" data-filter="price">
            <summary class="filter__title">Price</summary>
            <div class="filter__options">
              <label class="check"><input type="checkbox" value="£0-£10" /><span>£0 – £10</span></label>
              <label class="check"><input type="checkbox" value="£10-£20" /><span>£10 – £20</span></label>
              <label class="check"><input type="checkbox" value="£20-£30" /><span>£20 – £30</span></label>
              <label class="check"><input type="checkbox" value="£30-£40" /><span>£30 – £40</span></label>
              <label class="check"><input type="checkbox" value="£40-£50" /><span>£40 – £50</span></label>
              <label class="check"><input type="checkbox" value="£50-£60" /><span>£50 – £60</span></label>
              <label class="check"><input type="checkbox" value="£60-£70" /><span>£60 – £70</span></label>
              <label class="check"><input type="checkbox" value="£70-£80" /><span>£70 – £80</span></label>
              <label class="check"><input type="checkbox" value="£80-£90" /><span>£80 – £90</span></label>
              <label class="check"><input type="checkbox" value="£90-£100" /><span>£90 – £100</span></label>
              <label class="check"><input type="checkbox" value="£100+" /><span>£100+</span></label>
            </div>
          </details>
        </aside>

        <section class="shop-results">
          <div class="toolbar">
            <p class="result-count" id="result-count">Loading…</p>
            <div class="sort" id="sort-section">
              <label for="sort-select">Sort by</label>
              <select id="sort-select" class="input">
                <option value="relevance">Featured</option>
                <option value="price_low-high">Price: Low to High</option>
                <option value="price_high-low">Price: High to Low</option>
                <option value="alpha_a-z">Name: A – Z</option>
                <option value="alpha_z-a">Name: Z – A</option>
              </select>
            </div>
          </div>

          <div class="product-grid products">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
          </div>
        </section>
      </div>
    </main>

    <script src="../js/cart.js"></script>
    <script src="../js/shop.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/assistant.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
