<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="product.css" />
    <title>Clerks</title>
  </head>

  <body>
    <script src="../js/navbar.js"></script>

    <main class="container product-page">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="/index.html">Home</a>
        <span>/</span>
        <a href="/pages/shop.html" id="crumb-category">Shop</a>
        <span>/</span>
        <span class="breadcrumb__current" id="crumb-name">Loading…</span>
      </nav>

      <div class="product">
        <div class="gallery">
          <div class="gallery__main">
            <img id="main-image" src="../assets/mens_sports.png" alt="" />
          </div>
        </div>

        <div class="details">
          <span class="eyebrow" id="product-meta"></span>
          <h1 class="product-title" id="product-title">Loading…</h1>
          <p class="product-price-lg" id="product-price"></p>
          <p class="product-colour" id="product-colour"></p>

          <div class="size-picker">
            <div class="size-picker__head">
              <span class="size-picker__label">Select size (EU)</span>
              <span class="size-picker__selected" id="size-selected"></span>
            </div>
            <div class="size-grid" id="size-grid">
              <button type="button" class="size-btn" data-size="EU 36">36</button>
              <button type="button" class="size-btn" data-size="EU 37">37</button>
              <button type="button" class="size-btn" data-size="EU 38">38</button>
              <button type="button" class="size-btn" data-size="EU 39">39</button>
              <button type="button" class="size-btn" data-size="EU 40">40</button>
              <button type="button" class="size-btn" data-size="EU 41">41</button>
              <button type="button" class="size-btn" data-size="EU 42">42</button>
              <button type="button" class="size-btn" data-size="EU 43">43</button>
              <button type="button" class="size-btn" data-size="EU 44">44</button>
              <button type="button" class="size-btn" data-size="EU 45">45</button>
              <button type="button" class="size-btn" data-size="EU 46">46</button>
            </div>
            <p class="form-msg" id="size-msg" role="alert"></p>
          </div>

          <button class="btn btn--primary btn--lg btn--block" id="add-to-bag">
            Add to Bag
          </button>

          <ul class="perks-list">
            <li>Free UK delivery on orders over £50</li>
            <li>Free 30-day returns</li>
          </ul>

          <div class="spec">
            <h2 class="spec__title">Details</h2>
            <dl class="spec__list" id="spec-list"></dl>
          </div>
        </div>
      </div>
    </main>

    <script src="../js/cart.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/product.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
